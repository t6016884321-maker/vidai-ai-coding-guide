name: Codex 真实仓库挑战记录
description: 提交一次脱敏、可复现的真实仓库测试；成功和失败都欢迎
title: "[挑战记录] 日期 / 仓库类型 / 结果"
labels:
  - benchmark
body:
  - type: markdown
    attributes:
      value: |
        感谢参与。请勿提交 API Key、私有代码、账单、邮箱、个人路径或其他敏感信息。无法安全脱敏的内容请留空。
  - type: input
    id: date_timezone
    attributes:
      label: 日期与时区
      placeholder: 例如 2026-09-07 Asia/Shanghai
    validations:
      required: true
  - type: dropdown
    id: repository_type
    attributes:
      label: 仓库类型
      options:
        - Web 前端
        - 服务端 / API
        - CLI / 工具
        - 数据 / AI
        - 移动端
        - 其他
    validations:
      required: true
  - type: input
    id: scale
    attributes:
      label: 仓库规模（可选）
      description: 只填写大致文件数或代码行数，不要填写私有仓库名称。
      placeholder: 例如约 120 个源文件
  - type: input
    id: model
    attributes:
      label: 模型与线路
      description: 填写控制台模型名和线路，不要填写密钥。
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 任务与验收条件
      placeholder: 只描述可公开的任务，不要粘贴私有代码。
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 结果
      options:
        - 一次成功
        - 重试后成功
        - 未成功
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: 首响应 / 总耗时
      placeholder: 例如 8 秒 / 18 分钟
  - type: input
    id: retries
    attributes:
      label: 重试次数
      placeholder: 例如 1
  - type: input
    id: usage_cost
    attributes:
      label: Token 与实际扣费（可选）
      description: 仅填写汇总数字，不上传账单截图。
  - type: textarea
    id: tests_errors
    attributes:
      label: 测试结果或脱敏后的错误
      description: 删除密钥、私有代码、个人路径和身份信息。
  - type: checkboxes
    id: safety
    attributes:
      label: 发布确认
      options:
        - label: 我已确认内容中没有 API Key、私有代码、账单或个人信息。
          required: true
        - label: 我同意成功和失败记录均公开保留，便于其他开发者复现。
          required: true
